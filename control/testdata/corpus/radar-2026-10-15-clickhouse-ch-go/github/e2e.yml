name: e2e

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # A fail in one of the test instances shouldn't stop other. Make all the failures visible.
      matrix:
        go:
          - "1.26"
          - "1.27"
        # https://github.com/ClickHouse/ClickHouse/blob/master/SECURITY.md#scope-and-supported-versions
        clickhouse:
          - v26.4.3.37-stable
          - v26.3.12.3-lts
          - v26.2.19.43-stable
          - v25.8.24.21-lts
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Get Go environment
        id: go-env
        run: |
          echo "::set-output name=cache::$(go env GOCACHE)"
          echo "::set-output name=modcache::$(go env GOMODCACHE)"

      - name: Set up cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: e2e-${{ runner.os }}-go${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            e2e-${{ runner.os }}-go${{ matrix.go }}-

      - name: Set up ClickHouse cache
        uses: actions/cache@v6
        with:
          path: /opt/ch/clickhouse
          key: ClickHouse-${{ matrix.clickhouse }}

      - name: Check ClickHouse
        id: "ch_exists"
        uses: andstor/file-existence-action@v3
        with:
          files: /opt/ch/clickhouse

      - name: Download ClickHouse
        if: steps.ch_exists.outputs.files_exists != 'true'
        run: |
          # Docker tags omit the "v" prefix and channel suffix: v25.8.24.21-lts -> 25.8.24.21
          VER="${{ matrix.clickhouse }}"
          VER="${VER#v}"
          VER="${VER%-*}"
          id=$(docker create "clickhouse/clickhouse-server:$VER")
          sudo mkdir -p /opt/ch
          sudo docker cp -L "$id:/usr/bin/clickhouse" /opt/ch/clickhouse
          docker rm "$id"

      - name: Run tests
        env:
          CH_BIN: "/opt/ch/clickhouse"
          CH_E2E: "TRUE"
        run: go test -v ./...
