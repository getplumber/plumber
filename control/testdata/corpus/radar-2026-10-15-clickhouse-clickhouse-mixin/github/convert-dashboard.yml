name: Convert Dashboard to BYOC

on:
  push:
    paths:
      - "dashboard.json"
      - ".github/scripts/convert.py"
  pull_request:
    paths:
      - "dashboard.json"
      - ".github/scripts/convert.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Backup old file
        run: cp dashboard_byoc.json dashboard_byoc.json.old || touch dashboard_byoc.json.old

      - name: Run converter
        run: python3 .github/scripts/convert.py dashboard.json dashboard_byoc.json

      - name: Check if dashboard_byoc.json changed
        id: check_changes
        run: |
          if cmp -s dashboard_byoc.json.old dashboard_byoc.json; then
            echo "Files are identical"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Files are different"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "Changed: $([ -s $GITHUB_OUTPUT ] && grep changed $GITHUB_OUTPUT || echo 'not set')"

      - name: Upload dashboard_byoc.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: byoc-dashboard
          path: dashboard_byoc.json

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard_byoc.json
          git commit -m "chore: update dashboard_byoc.json from dashboard.json [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
