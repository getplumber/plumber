name: Nightly head test

on:
  schedule:
    # Run once a day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  test-head:
    name: Test against ClickHouse HEAD
    uses: ./.github/workflows/reusable.yml
    secrets: inherit
    with:
      clickhouse-version: head
    permissions:
      statuses: write

  test-head-tcp:
    name: Test against ClickHouse HEAD (TCP)
    # The TCP suite has no `head` entry in its own matrix (tests-tcp.yml), so head coverage for the
    # native-protocol driver lives here, next to the HTTP head run.
    uses: $/.github/workflows/reusable-tcp.yml
    with:
      clickhouse-version: head

  benchmark-full:
    name: Full benchmark suite
    uses: $/.github/workflows/benchmark.yml
    with:
      categories: ''
