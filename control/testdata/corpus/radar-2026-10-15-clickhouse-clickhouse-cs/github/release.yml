name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release/tag name
        required: true
        type: string

run-name: Release ${{ inputs.version }}

jobs:
  # Gate: refuse to publish a version whose changelog.d/ fragments were never folded in.
  #
  # Runs before anything is built, signed or pushed, because both outputs of this workflow are
  # effectively permanent: a NuGet package cannot be unpublished (only delisted), and
  # RELEASENOTES.md is baked into the package via PackageReleaseNotes. Releasing without running
  # `--release` first would ship a package whose notes describe the previous version, silently.
  verify_changelog:
    name: Verify changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # The version is passed through the environment rather than interpolated into the run script,
    # so a workflow_dispatch input cannot inject shell.
    - name: Verify the changelog was assembled for this version
      env:
        VERSION: ${{ inputs.version }}
      run: dotnet run scripts/changelog.cs -- --verify-release "$VERSION"

  # Build job
  # Should only use official actions and tools
  build:
    name: Build
    needs: [verify_changelog]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # As in verify_changelog, the version reaches the run script through the environment. This
    # job runs on windows-latest, where the default shell is PowerShell, hence $env:VERSION.
    - name: Build & pack
      id: build_pack
      env:
        VERSION: ${{ inputs.version }}
      run: dotnet build ClickHouse.Driver\ClickHouse.Driver.csproj --configuration Release "/p:Version=$env:VERSION"

    - name: Upload unsigned package
      uses: actions/upload-artifact@v7
      with:
        name: package-unsigned-${{ inputs.version }}
        path: ClickHouse.Driver/bin/Release/ClickHouse.Driver.*nupkg

  # Sign the package
  sign:
    name: Sign NuGet Package
    runs-on: windows-latest
    needs: [build]
    steps:
    - name: Create directories
      run: |
        New-Item ${{ github.workspace }}\run -ItemType directory
        New-Item ${{ github.workspace }}\package -ItemType directory

    - name: Download unsigned package
      uses: actions/download-artifact@v8
      with:
        name: package-unsigned-${{ inputs.version }}
        path: ${{ github.workspace }}/package

    - name: Create pkcs11properties.cfg file
      run: |
        $content = @"
        name=signingmanager
        library="C:\\Program Files\\DigiCert\\DigiCert Keylocker Tools\\smpkcs11.dll"
        slotListIndex=0
        "@

        Write-Host "Writing pkcs11properties.cfg file"
        $content | Out-File -FilePath ${{ github.workspace }}\run\pkcs11properties.cfg -Encoding ASCII
        Get-Content ${{ github.workspace }}\run\pkcs11properties.cfg

    - name: Create signing certificate
      run: |
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}\run\Certificate_pkcs12.p12", [System.Convert]::FromBase64String("${{ secrets.SM_CLIENT_CERT_FILE_B64 }}"))

    - name: Download Keylocker tools
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
      run: >
        Invoke-WebRequest
        https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download
        -Headers @{"x-api-key" = $env:SM_API_KEY}
        -OutFile Keylockertools-windows-x64.msi

    - name: Install Keylocker tools
      run: |
        Start-Process msiexec.exe -ArgumentList '/i Keylockertools-windows-x64.msi /passive /quiet /norestart' -Wait

    - name: Check Keylocker tools
      run: |
        & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" --version

    - name: Sync the certificates
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        PKCS11_CONFIG: "${{ github.workspace }}\\run\\pkcs11properties.cfg"
        SM_CLIENT_CERT_FILE: "${{ github.workspace }}\\run\\Certificate_pkcs12.p12"
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_HOST: ${{ secrets.SM_HOST }}
        SM_TLS_SKIP_VERIFY: false
        DIGICERT_KEY_ALIAS: ${{ secrets.DIGICERT_KEY_ALIAS }}
        SM_LOG_LEVEL: TRACE
      run: >
        & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" windows certsync

    - name: Sign NuGet packages
      env:
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        PKCS11_CONFIG: "${{ github.workspace }}\\run\\pkcs11properties.cfg"
        SM_CLIENT_CERT_FILE: "${{ github.workspace }}\\run\\Certificate_pkcs12.p12"
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_HOST: ${{ secrets.SM_HOST }}
        SM_TLS_SKIP_VERIFY: false
        DIGICERT_KEY_ALIAS: ${{ secrets.DIGICERT_KEY_ALIAS }}
        SM_LOG_LEVEL: TRACE
      run: |
        Get-ChildItem -Path "${{ github.workspace }}\package" -Filter "*.nupkg" | ForEach-Object {
          Write-Host "Signing $($_.FullName)"
          & "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe" sign `
            --fingerprint ${{ secrets.DIGICERT_FINGERPRINT }} `
            --input $_.FullName
        }

    - name: Verify signatures
      run: |
        dotnet nuget verify --all "${{ github.workspace }}\package\*.nupkg"

    - name: Upload signed package
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: ${{ github.workspace }}/package/ClickHouse.Driver.*nupkg

  # Publishes with NuGet.org trusted publishing: GitHub issues an OIDC token for this job,
  # NuGet.org matches it against a policy naming this owner, repository and workflow file, and
  # returns an API key that is valid for one hour. No long-lived key is stored in the repository.
  push_nuget_org:
    runs-on: windows-latest
    needs: [sign]
    name: Upload to NuGet.org
    permissions:
      id-token: write # request the OIDC token that NuGet.org exchanges for an API key
      contents: read
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v8
      with:
        name: package

    # NUGET_USER is the NuGet.org username of the account that created the trusted publishing
    # policy, which is not necessarily the account that owns the packages.
    - name: Get a short-lived NuGet API key
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    # The key goes through the environment because a ${{ }} expansion is substituted into the
    # script text before the shell runs. PowerShell then passes the value as one argument
    # whatever characters it holds, which cmd's %VAR% expansion does not guarantee.
    - name: Push package
      id: push
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ClickHouse.Driver.*.nupkg --skip-duplicate --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json

  github_release:
    runs-on: ubuntu-latest
    needs: [sign]
    name: Create GitHub release
    permissions:
      contents: write
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v8
      with:
        name: package
    # gh is preinstalled on the runner, so creating the release needs no third-party action.
    # draft and prerelease default to false. The version goes through the environment, as
    # everywhere else in this file. This job does not check out the repository, so gh cannot
    # infer which repository to act on from a git remote -- hence GH_REPO.
    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
      run: gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes *.nupkg *.snupkg
