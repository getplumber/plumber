name: PureGo CI

# CI for the pure-Go SDK module (purego/). Unlike the cgo-based go/ module, this
# one links no Rust FFI, so it needs no Cargo/Rust toolchain — just Go. The test
# job runs under the race detector because the transport layer is concurrency
# sensitive (single-writer send, separate recv goroutine, and a supervisor that
# will reassign the stream ID on recovery).

on:
  workflow_call:

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      # gofmt needs no module downloads, so no registry configuration here.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # Verify the committed protobuf bindings (internal/zerobuspb) are in sync with
  # the canonical schema (rust/sdk/zerobus_service.proto). These files are
  # committed, not generated at build time, so this gate catches a proto change
  # that forgot to regenerate them. Tooling is pinned to the versions in
  # internal/zerobuspb/gen.go so regeneration is byte-for-byte reproducible.
  generate:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      # protoc pinned to match gen.go (renders as "protoc v6.33.0" in the output
      # header). A version mismatch changes the embedded descriptor bytes and
      # fails the diff below — bump this together with gen.go.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: '33.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Plugin versions pinned to gen.go so the output is deterministic.
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate bindings
        run: go generate ./...

      - name: Fail if committed bindings are stale
        run: |
          if ! git diff --exit-code -- internal/zerobuspb/; then
            echo "internal/zerobuspb is out of date with the proto."
            echo "Run 'go generate ./...' in purego/internal/zerobuspb and commit the result."
            exit 1
          fi

  vet:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

  test:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      # `-race` needs CGO and a C compiler (the detector's requirement, not the
      # SDK's) — both on the Linux runner. It instruments Go code, so this run
      # covers data races regardless of target OS; no Windows entry needed.
      - name: Run tests (race detector)
        run: go test -race ./...

      - name: Run tests (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
