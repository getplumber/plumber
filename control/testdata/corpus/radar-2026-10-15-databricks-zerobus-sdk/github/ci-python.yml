name: Python CI

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.9'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.10'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.11'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.12'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.13'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.14'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            pyVersion: '3.12'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            pyVersion: '3.13'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            pyVersion: '3.14'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - name: Unshallow
        run: git fetch --prune --unshallow || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.pyVersion }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Copy root LICENSE for maturin
        shell: bash
        run: cp ../LICENSE LICENSE

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: make dev test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          test -f LICENSE || cp ../LICENSE LICENSE
          .venv/Scripts/python -m pip install -r requirements-dev.lock
          .venv/Scripts/python -m maturin develop
          .venv/Scripts/python -m pytest --cov=zerobus --cov-report html --cov-report xml tests

  # Builds one abi3 wheel on the oldest supported Python and imports it on every
  # newer one. The `test` job rebuilds per version, so it cannot catch this.
  abi3-compat:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"

      # Install every supported version; the last one is the default `python`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.9
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Copy root LICENSE for maturin
        run: cp ../LICENSE LICENSE

      - name: Build abi3 wheel on Python 3.9
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          python -m pip install --upgrade pip
          python -m pip install maturin==1.8.3
          python -m maturin build --release --manifest-path rust/Cargo.toml --out dist

      - name: Install and import the 3.9 wheel on every supported version
        run: |
          for v in 3.9 3.10 3.11 3.12 3.13 3.14; do
            echo "::group::Python $v"
            "python$v" -m venv "/tmp/abi3-$v"
            "/tmp/abi3-$v/bin/python" -m pip install --quiet --no-deps dist/*.whl
            # -I keeps the working directory off sys.path, so this imports the
            # installed wheel rather than the source tree next to it.
            "/tmp/abi3-$v/bin/python" -I - <<'PY'
          import sys

          import zerobus
          from zerobus._zerobus_core import aio, arrow, sync

          assert "site-packages" in zerobus.__file__, zerobus.__file__
          sync.ZerobusSdk("grpc.example.com:443", "https://example.com")
          aio.ZerobusSdk("grpc.example.com:443", "https://example.com")
          print(f"OK on {sys.version.split()[0]}")
          PY
            echo "::endgroup::"
          done

  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Copy root LICENSE for maturin
        run: cp ../LICENSE LICENSE

      - name: Format all files
        run: make dev fmt

      - name: Fail on differences
        run: git diff --exit-code

  lint:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Copy root LICENSE for maturin
        run: cp ../LICENSE LICENSE

      - name: Lint code
        run: make dev lint
