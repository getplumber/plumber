name: Build TypeScript
run-name: "Build TypeScript SDK ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      macos-binaries-release:
        description: "Optional GitHub Release tag with zerobus-ingest-sdk.darwin-*.node files to add for macOS. Those binaries must include Arrow Flight (npm run build:arrow). Leave empty to skip macOS."
        required: false
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: x86_64-unknown-linux-gnu
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: aarch64-unknown-linux-gnu
          - runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            target: x86_64-pc-windows-msvc

    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"

      - name: Configure cargo for JFrog
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"

      - name: Configure npm registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-npm.sh"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build:arrow -- --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload native binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.target }}
          path: 'typescript/*.node'
          if-no-files-found: error

      - name: Upload JS/TS entry points
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-binding
          path: |
            typescript/index.js
            typescript/index.d.ts
          if-no-files-found: error

  # Darwin .node files are not compiled here. Added binaries must include
  # Arrow Flight (`npm run build:arrow`).
  import-macos:
    if: inputs.macos-binaries-release != ''
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download darwin .node binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.macos-binaries-release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$REF" \
            --repo "${{ github.repository }}" \
            --pattern 'zerobus-ingest-sdk.darwin-*.node' \
            --dir dist/
          test -f dist/zerobus-ingest-sdk.darwin-x64.node
          test -f dist/zerobus-ingest-sdk.darwin-arm64.node
          ls -lh dist/zerobus-ingest-sdk.darwin-*.node

      - name: Upload darwin bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-macos
          path: dist/zerobus-ingest-sdk.darwin-*.node
          if-no-files-found: error
