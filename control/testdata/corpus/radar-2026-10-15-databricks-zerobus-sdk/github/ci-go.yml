name: Go CI

on:
  workflow_call:
    inputs:
      run_published_artifact_tests:
        description: 'Run smoke tests that download and consume published FFI artifacts'
        type: boolean
        default: true

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Format all files
        run: make fmt

      - name: Fail on differences
        run: git diff --exit-code

  lint:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Lint code
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - name: Unshallow
        run: git fetch --prune --unshallow

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Install Rust toolchain (Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build Rust FFI
        run: make build-rust

      - name: Build Go SDK
        run: make build-go

      - name: Run tests
        run: make test

      - name: Build examples
        run: make examples

  user-experience:
    if: inputs.run_published_artifact_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            lib: lib/linux_amd64/libzerobus_ffi.a
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            lib: lib/windows_amd64/libzerobus_ffi.a
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run go generate (user step 1)
        run: go generate -v

      - name: Verify library built
        run: test -f ${{ matrix.lib }}

      - name: Test go build works (user step 2)
        run: go build -v

      - name: Test JSON single example builds
        working-directory: go/examples/json/single
        run: go build -v

      - name: Test JSON batch example builds
        working-directory: go/examples/json/batch
        run: go build -v

      - name: Test Proto single example builds
        working-directory: go/examples/proto/single
        run: go build -v

      - name: Test Proto batch example builds
        working-directory: go/examples/proto/batch
        run: go build -v
