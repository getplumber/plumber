name: Java CI

on:
  workflow_call:

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
      - name: Configure Maven registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-maven.sh"
      - name: Check formatting
        run: mvn spotless:check
      - name: Fail on formatting differences
        if: failure()
        run: |
          echo "Code formatting issues detected. Run 'mvn spotless:apply' to fix."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '11'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '17'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '21'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            javaVersion: '21'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Unshallow
        run: git fetch --prune --unshallow || true
      - name: Set up JDK ${{ matrix.javaVersion }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.javaVersion }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Configure Maven registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-maven.sh"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build JNI native library
        working-directory: rust
        shell: bash
        run: cargo build --release -p zerobus-jni --features test-helpers
      - name: Stage native library for tests
        shell: bash
        run: |
          set -euo pipefail
          OS=$(uname -s)
          ARCH=$(uname -m)
          case "$OS" in
            MINGW*|MSYS*|CYGWIN*|Windows_NT)
              PLATFORM="windows-x86_64"
              LIB_NAME="zerobus_jni.dll"
              ;;
            *)
              case "$ARCH" in
                x86_64|amd64) PLATFORM="linux-x86_64" ;;
                aarch64|arm64) PLATFORM="linux-aarch64" ;;
                *) echo "Unsupported arch: $ARCH"; exit 1 ;;
              esac
              LIB_NAME="libzerobus_jni.so"
              ;;
          esac
          mkdir -p src/main/resources/native/$PLATFORM
          cp ../rust/target/release/$LIB_NAME src/main/resources/native/$PLATFORM/
          echo "Staged native library for $PLATFORM"
      - name: Install Maven (macOS)
        if: runner.os == 'macOS'
        run: brew install maven 2>/dev/null || true
      - name: Build with Maven
        run: mvn clean compile
      - name: Run tests
        run: mvn test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}-java-${{ matrix.javaVersion }}
          path: |
            java/target/surefire-reports/
            java/target/test-classes/
          retention-days: 7
