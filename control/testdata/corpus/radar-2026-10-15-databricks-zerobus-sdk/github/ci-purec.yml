name: Pure C CI

on:
  workflow_call:

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purec
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang-format
      - name: Check formatting
        run: make fmt-check

  # Like Pure Go, regenerate with pinned tools and compare against the checked-in
  # bindings. Jammy supplies the protobuf-c 1.3.3 generator.
  generate:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    container: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    defaults:
      run:
        working-directory: purec
        shell: bash
    steps:
      - name: Install generation tools
        working-directory: ${{ github.workspace }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git unzip cmake make protobuf-c-compiler
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Read pinned generator versions
        id: proto-tools
        run: cmake -DPRINT_TOOL_VERSIONS=ON -P proto/generate-proto.cmake >> "$GITHUB_OUTPUT"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: ${{ steps.proto-tools.outputs.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail if committed bindings are stale
        run: |
          generated_dir="$(mktemp -d)"
          make generate-proto CMAKE_EXTRA="-DGENERATED_DIR=$generated_dir"
          if ! diff -ru proto/generated "$generated_dir"; then
            echo "proto/generated/ is out of date with the proto."
            echo "Run 'make generate-proto' in purec and commit the result."
            exit 1
          fi

  test:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purec
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-c-dev
      - name: Build and test with warnings as errors
        run: make test CMAKE_EXTRA=-DZEROBUS_WERROR=ON

  sanitize:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purec
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-c-dev
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test SANITIZE=address,undefined BUILD_TYPE=Debug

  sanitize-thread:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purec
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-c-dev
      - name: Build and test with ThreadSanitizer and UndefinedBehaviorSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test SANITIZE=thread,undefined BUILD_TYPE=Debug
