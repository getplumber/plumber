name: Deploy telescopetest.io production site (no-op on forks)
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'packages/telescope-web/**'
      - '!packages/telescope-web/.opencode/**'
      - '!packages/telescope-web/opencode.json'

jobs:
  deploy:
    if: github.repository == 'cloudflare/telescope'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/krypton'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      # Install from the repo root: this is an npm workspaces monorepo with a
      # single lockfile at the root, so `npm ci` cannot run inside a package.
      # Later steps stay in ./packages/telescope-web because wrangler, prisma
      # and astro need that directory's config files; npx resolves their
      # binaries from the hoisted root node_modules/.bin.
      - name: install dependencies
        run: npm ci

      - name: run any new migrations
        working-directory: ./packages/telescope-web
        run: npx wrangler d1 migrations apply telescope-db --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: generate prisma client
        working-directory: ./packages/telescope-web
        run: npx prisma generate

      - name: build astro site
        working-directory: ./packages/telescope-web
        run: CLOUDFLARE_ENV=production npx astro build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: deploy to cloudflare workers
        working-directory: ./packages/telescope-web
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
