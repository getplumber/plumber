name: Deploy waterfall.telescopetest.io production site (no-op on forks)
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "packages/waterfall/**"

jobs:
  deploy:
    if: github.repository == 'cloudflare/telescope'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/krypton"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      # Install from the repo root: this is an npm workspaces monorepo with a
      # single lockfile at the root, so `npm ci` cannot run inside a package.
      - name: install dependencies
        run: npm ci

      - name: build demo site
        run: npm run build:demo -w packages/waterfall

      - name: deploy to cloudflare workers
        working-directory: ./packages/waterfall
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
