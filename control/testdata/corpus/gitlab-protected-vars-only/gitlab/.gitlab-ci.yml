stages:
- test
- release
default:
  image: python:3.12-slim
test:
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
  - pip install -r requirements-dev.txt
  - pytest
release:
  stage: release
  image: python:3.12.4-slim@sha256:2fba8e70a87bcc9f6edd20dda0a1d4adb32046d2acbca7361bc61da5a106a914
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - pip install -r requirements-release.txt
  - python -m build
  - twine upload dist/*
