        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Run Cleanup
        run: go test -tags integration -run TestHelper_CleanupIntegrationTestsArtifactsGitHub github_test.go integrationutils.go commands.go -v
        env:
          JF_URL: ${{ secrets.PLATFORM_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          FROGBOT_V3_TESTS_GITHUB_TOKEN: ${{ secrets.FROGBOT_V3_TESTS_GITHUB_TOKEN }}

