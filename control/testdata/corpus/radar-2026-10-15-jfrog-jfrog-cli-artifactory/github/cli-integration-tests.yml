          RT_CONNECTION_TIMEOUT_SECONDS: '1200'

      - name: Run Ruby tests
        working-directory: jfrog-cli
        run: go test -v github.com/jfrog/jfrog-cli --timeout 0 --test.ruby

  HuggingFace-Tests:
    name: HuggingFace ${{ matrix.os.name }} (huggingface_hub ${{ matrix.hf_version }})
    needs: Detect-Deps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu
            version: 24.04
          - name: windows
            version: 2022
        # 1.19.0: last version before the breaking change. 1.20.0: the version that
        # introduced it (PR #4324, strict RepoUrl/parse_hf_uri). 1.29.0: current target
        # version for this fix.
        hf_version: ['1.19.0', '1.20.0', '1.29.0']
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    env:
      JFROG_CLI_LOG_LEVEL: DEBUG
    steps:
      - name: Checkout jfrog-cli-artifactory
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout all JFrog repositories
        uses: ./.github/actions/checkout-jfrog-repos
        with:
          build_info_go_repo: ${{ needs.Detect-Deps.outputs.build_info_go_repo }}
          build_info_go_ref: ${{ needs.Detect-Deps.outputs.build_info_go_ref }}
          jfrog_client_go_repo: ${{ needs.Detect-Deps.outputs.jfrog_client_go_repo }}
          jfrog_client_go_ref: ${{ needs.Detect-Deps.outputs.jfrog_client_go_ref }}
          jfrog_cli_core_repo: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_repo }}
          jfrog_cli_core_ref: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install HuggingFace Library
        shell: bash
        run: pip install "huggingface_hub==${{ matrix.hf_version }}"

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - name: Setup Go workspace
        uses: ./.github/actions/setup-go-workspace
        with:
          os_name: ${{ matrix.os.name }}

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@main
        with:
          RTLIC: ${{ secrets.RTLIC }}
          RT_CONNECTION_TIMEOUT_SECONDS: '1200'

      - name: Run HuggingFace tests
        working-directory: jfrog-cli
        run: go test -v github.com/jfrog/jfrog-cli --timeout 0 --test.huggingface --jfrog.url=http://127.0.0.1:8082 --jfrog.adminToken=${{ env.JFROG_TESTS_LOCAL_ACCESS_TOKEN }}

  Nix-Tests:
    name: Nix ubuntu
    needs: Detect-Deps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    runs-on: ubuntu-24.04
    env:
      JFROG_CLI_LOG_LEVEL: DEBUG
    steps:
      - name: Checkout jfrog-cli-artifactory
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout all JFrog repositories
        uses: ./.github/actions/checkout-jfrog-repos
        with:
          build_info_go_repo: ${{ needs.Detect-Deps.outputs.build_info_go_repo }}
          build_info_go_ref: ${{ needs.Detect-Deps.outputs.build_info_go_ref }}
          jfrog_client_go_repo: ${{ needs.Detect-Deps.outputs.jfrog_client_go_repo }}
          jfrog_client_go_ref: ${{ needs.Detect-Deps.outputs.jfrog_client_go_ref }}
          jfrog_cli_core_repo: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_repo }}
          jfrog_cli_core_ref: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - name: Setup Go workspace
        uses: ./.github/actions/setup-go-workspace
        with:
          os_name: ubuntu

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@main
        with:
          RTLIC: ${{ secrets.RTLIC }}
          RT_CONNECTION_TIMEOUT_SECONDS: '1200'

      - name: Run Nix tests
        working-directory: jfrog-cli
        run: go test -v github.com/jfrog/jfrog-cli --timeout 0 --test.nix

  Alpine-APK-Tests:
    name: Alpine APK (${{ matrix.alpine-version }})
    needs: Detect-Deps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alpine-version: v3.18, apk-tools: v2 }
          - { alpine-version: v3.21, apk-tools: v2 }
          - { alpine-version: v3.23, apk-tools: v3 }
    env:
      JFROG_CLI_LOG_LEVEL: DEBUG
    steps:
      - name: Checkout jfrog-cli-artifactory
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout all JFrog repositories
        uses: ./.github/actions/checkout-jfrog-repos
        with:
          build_info_go_repo: ${{ needs.Detect-Deps.outputs.build_info_go_repo }}
          build_info_go_ref: ${{ needs.Detect-Deps.outputs.build_info_go_ref }}
          jfrog_client_go_repo: ${{ needs.Detect-Deps.outputs.jfrog_client_go_repo }}
          jfrog_client_go_ref: ${{ needs.Detect-Deps.outputs.jfrog_client_go_ref }}
          jfrog_cli_core_repo: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_repo }}
          jfrog_cli_core_ref: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_ref }}

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - name: Setup Go workspace
        uses: ./.github/actions/setup-go-workspace
        with:
          os_name: ubuntu

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@main
        with:
          RTLIC: ${{ secrets.RTLIC }}
          RT_CONNECTION_TIMEOUT_SECONDS: '1200'

      # Cross-compile a static test binary on the host and run it inside the target Alpine container.
      - name: Build test binary
        working-directory: jfrog-cli
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o apk.test .

      - name: Run Alpine APK tests (alpine:${{ matrix.alpine-version }})
        env:
          ALPINE_VER: ${{ matrix.alpine-version }}
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/jfrog-cli":/workspace \
            -w /workspace \
            "alpine:${ALPINE_VER#v}" \
            ./apk.test -test.v -test.timeout 0 -test.run "TestApk|TestSetupApk" -test.alpine

  Apt-Tests:
    name: apt (${{ matrix.distro.name }}, ${{ matrix.user_mode }})
    needs: Detect-Deps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { image: "ubuntu:22.04", name: ubuntu-jammy, dist: jammy }
          - { image: "ubuntu:24.04", name: ubuntu-noble, dist: noble }
          - { image: "debian:12",    name: debian-bookworm, dist: bookworm }
        user_mode: [root, nonroot]
    env:
      JFROG_CLI_LOG_LEVEL: DEBUG
    steps:
      - name: Checkout jfrog-cli-artifactory
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout all JFrog repositories
        uses: ./.github/actions/checkout-jfrog-repos
        with:
          build_info_go_repo: ${{ needs.Detect-Deps.outputs.build_info_go_repo }}
          build_info_go_ref: ${{ needs.Detect-Deps.outputs.build_info_go_ref }}
          jfrog_client_go_repo: ${{ needs.Detect-Deps.outputs.jfrog_client_go_repo }}
          jfrog_client_go_ref: ${{ needs.Detect-Deps.outputs.jfrog_client_go_ref }}
          jfrog_cli_core_repo: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_repo }}
          jfrog_cli_core_ref: ${{ needs.Detect-Deps.outputs.jfrog_cli_core_ref }}

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - name: Setup Go workspace
        uses: ./.github/actions/setup-go-workspace
        with:
          os_name: ubuntu

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@main
        with:
          RTLIC: ${{ secrets.RTLIC }}
          RT_CONNECTION_TIMEOUT_SECONDS: '1200'

      - name: Compile apt test binary
        working-directory: jfrog-cli
        env:
          CGO_ENABLED: "0"
        run: go test -c -o apt.test .

      - name: Run apt tests (${{ matrix.distro.image }}, ${{ matrix.user_mode }})
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/jfrog-cli:/workspace" \
            -w /workspace \
            -e JFROG_TESTS_LOCAL_ACCESS_TOKEN \
            -e APT_TEST_DIST="${{ matrix.distro.dist }}" \
            -e USER_MODE="${{ matrix.user_mode }}" \
            -e CI_RUN_ID="${{ matrix.distro.name }}-${{ matrix.user_mode }}" \
            "${{ matrix.distro.image }}" \
            bash -c '
              set -eu
              apt-get update -y
              apt-get install -y --no-install-recommends gnupg sudo

              if [ "$USER_MODE" = "nonroot" ]; then
                useradd -m -u 1001 -s /bin/bash testuser
                echo "testuser ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/apt" > /etc/sudoers.d/testuser-apt
                chmod 0440 /etc/sudoers.d/testuser-apt
                mkdir -p /etc/apt/keyrings
                chown -R testuser:testuser \
                  /etc/apt/sources.list.d /etc/apt/preferences.d /etc/apt/keyrings /workspace

                su -c "/workspace/apt.test -test.v -test.timeout=0 -test.run=TestApt \
                  --test.apt --ci.runId=$CI_RUN_ID" testuser
              else
                /workspace/apt.test -test.v -test.timeout=0 -test.run=TestApt \
                  --test.apt --ci.runId="$CI_RUN_ID"
              fi
            '
