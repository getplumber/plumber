name: "CHANGELOG check"
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    name: Check Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Token-less changelog check: verifies CHANGELOG.md is part of the PR diff.
      # This uses only git (no API calls, no checks:write), so it works on fork PRs
      # with the default read-only GITHUB_TOKEN — unlike the previous action, which
      # tried to create a check run and failed with HTTP 403 on forks. Skipped when
      # the PR carries the "no changelog" label.
      - name: Changelog check
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 above means the PR base commit is already present, so we
          # can diff the checked-out merge ref against it with no extra fetch.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${BASE_SHA}" HEAD | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md was updated in this PR."
          else
            echo "::error::CHANGELOG.md was not updated. Please update CHANGELOG.md, or add the 'no changelog' label to this PR."
            exit 1
          fi
