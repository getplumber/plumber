name: release
run-name: Release ${{ inputs.working-directory }} by @${{ github.actor }}
on:
  workflow_call:
    inputs:
      uv-version:
        required: true
        type: string
        description: "uv version to install"
      working-directory:
        required: true
        type: string
        description: "From which folder this pipeline executes"
  workflow_dispatch:
    inputs:
      uv-version:
        required: true
        type: string
        default: "0.12.3"
      working-directory:
        required: true
        type: string
        default: "libs/azure-dynamic-sessions"

permissions: {}

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      pkg-name: ${{ steps.check-version.outputs.pkg-name }}
      version: ${{ steps.check-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv ${{ inputs.uv-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ env.PYTHON_VERSION }}

      # We want to keep this build stage *separate* from the release stage,
      # so that there's no sharing of permissions between them.
      # The release stage has trusted publishing and GitHub repo contents write access,
      # and we want to keep the scope of that access limited just to the release job.
      # Otherwise, a malicious `build` step (e.g. via a compromised dependency)
      # could get access to our GitHub or PyPI credentials.
      #
      # Per the trusted publishing GitHub Action:
      # > It is strongly advised to separate jobs for building [...]
      # > from the publish job.
      # https://github.com/pypa/gh-action-pypi-publish#non-goals
      - name: Build project for distribution
        run: uv build
        working-directory: ${{ inputs.working-directory }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/

      - name: Check Version
        id: check-version
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo pkg-name="$(uv version | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          echo version="$(uv version --short)" >> $GITHUB_OUTPUT

  test-pypi-publish:
    needs:
      - build
    uses: ./.github/workflows/_test_release.yml
    permissions:
      contents: read
      id-token: write
    with:
      uv-version: ${{ inputs.uv-version }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  pre-release-checks:
    needs:
      - build
      - test-pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PKG_NAME: ${{ needs.build.outputs.pkg-name }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # We explicitly *don't* set up caching here. This ensures our tests are
      # maximally sensitive to catching breakage.
      #
      # For example, here's a way that caching can cause a falsely-passing test:
      # - Make the langchain package manifest no longer list a dependency package
      #   as a requirement. This means it won't be installed by `pip install`,
      #   and attempting to use it would cause a crash.
      # - That dependency used to be required, so it may have been cached.
      #   When restoring the venv packages from cache, that dependency gets included.
      # - Tests pass, because the dependency is present even though it wasn't specified.
      # - The package is published, and it breaks on the missing dependency when
      #   used in the real world.

      - name: Set up Python + uv ${{ inputs.uv-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download package from TestPyPI
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          download_package() {
            uvx --python "$PYTHON_VERSION" pip download \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --only-binary=:all: \
              --dest dist \
              "$PKG_NAME==$VERSION"
          }
          download_package || { sleep 5; download_package; }

      - name: Import package from TestPyPI
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          wheels=("$PWD"/dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          echo "RELEASE_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install \
            --python "$RUNNER_TEMP/release-smoke/bin/python" \
            --prerelease=allow \
            "${wheels[0]}"

          "$RUNNER_TEMP/release-smoke/bin/python" -I -c "import ${PKG_NAME//-/_}"

      - name: Import test dependencies
        run: uv sync --frozen --all-extras --group test --group test_integration --no-install-project
        working-directory: ${{ inputs.working-directory }}

      - name: Prepare release tests
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          uv pip install --no-deps --reinstall-package "$PKG_NAME" "$RELEASE_WHEEL"
          mkdir -p "$RUNNER_TEMP/release-tests"
          cp -R tests Makefile pyproject.toml uv.lock "$RUNNER_TEMP/release-tests/"
          echo "UV_PROJECT_ENVIRONMENT=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Run unit tests
        shell: bash
        env:
          UV_NO_SYNC: "1"
        run: |
          if [[ "$PKG_NAME" == "langchain-azure-postgresql" ]]; then
            uv run --no-sync tox run -m test --installpkg "$RELEASE_WHEEL" \
              -x 'tool.tox.env_run_base.set_env=PYTEST_ADDOPTS=--pyargs tests langchain_azure_postgresql'
          else
            make tests
          fi
        working-directory: ${{ runner.temp }}/release-tests

      - name: Run integration tests
        shell: bash
        env:
          UV_NO_SYNC: "1"
        run: |
          if [[ "$PKG_NAME" == "langchain-azure-postgresql" ]]; then
            uv run --no-sync tox run -m test --installpkg "$RELEASE_WHEEL" \
              -x 'tool.tox.env_run_base.set_env=PYTEST_ADDOPTS=--pyargs tests langchain_azure_postgresql'
          else
            make integration_tests
          fi
        working-directory: ${{ runner.temp }}/release-tests

      - name: Get minimum versions
        working-directory: ${{ inputs.working-directory }}
        id: min-version
        shell: bash
        run: |
          uv pip install packaging
          min_versions="$(uv run --no-project python $GITHUB_WORKSPACE/.github/scripts/get_min_versions.py pyproject.toml)"
          echo "min-versions=$min_versions" >> "$GITHUB_OUTPUT"
          echo "min-versions=$min_versions"

      - name: Run unit tests with minimum dependency versions
        if: ${{ steps.min-version.outputs.min-versions != '' }}
        env:
          MIN_VERSIONS: ${{ steps.min-version.outputs.min-versions }}
          UV_NO_SYNC: "1"
        run: |
          uv pip install $MIN_VERSIONS
          make tests
        working-directory: ${{ inputs.working-directory }}

  publish:
    needs:
      - build
      - test-pypi-publish
      - pre-release-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This permission is used for trusted publishing:
      # https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/
      #
      # Trusted publishing has to also be configured on PyPI for each package:
      # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
      id-token: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv ${{ inputs.uv-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory }}/dist/
          verbose: true
          print-hash: true
          # Temp workaround since attestations are on by default as of gh-action-pypi-publish v1\.11\.0
          attestations: false

  mark-release:
    needs:
      - build
      - test-pypi-publish
      - pre-release-checks
      - publish
    runs-on: ubuntu-latest
    permissions:
      # This permission is needed by `ncipollo/release-action` to
      # create the GitHub release.
      contents: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv ${{ inputs.uv-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ inputs.working-directory }}/dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          tag: ${{ inputs.working-directory }}/v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
