stages:
- test
- release
unit-tests:
  stage: test
  image: node:latest
  script:
  - npm ci
  - npm test
release:
  stage: release
  image: node:20.11.1-alpine3.19@sha256:9a1b6ed2bd0d7a3e5c3d8c3b7c8f2e1d0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d
  environment: npm
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - npm ci
  - npm publish
