# Source of truth: https://github.com/getplumber/plumber/blob/main/templates/plumber.yml
spec:
  inputs:
    # Authentication
    # Requires a GitLab token with read_api + read_repository scopes (or api scope if mr_comment is enabled)
    # Set GITLAB_TOKEN as a CI/CD variable in Settings > CI/CD > Variables
    gitlab_token:
      description: GitLab API token (requires read_api + read_repository scopes, or api scope if mr_comment is enabled)
      default: $GITLAB_TOKEN

    # Project configuration
    # These can be overridden but default to GitLab CI predefined variables
    project_path:
      description: Full path of the GitLab project to analyze
      default: $CI_PROJECT_PATH
    branch:
      description: Branch to analyze
      default: $CI_COMMIT_REF_NAME
    server_url:
      description: GitLab instance URL
      default: $CI_SERVER_URL
    ci_config_path:
      description: CI configuration file path. Defaults to the GitLab predefined variable $CI_CONFIG_PATH (usually .gitlab-ci.yml). Override to point at a different file.
      default: $CI_CONFIG_PATH

    # Control configuration
    # Default conf can be found at https://gitlab.com/getplumber/plumber/-/blob/main/.plumber.yaml
    # Priority: 1) config_file input (if set), 2) .plumber.yaml in repo (if exists), 3) default config
    config_file:
      description: Path to Plumber config file (relative to repo root). If not set, local `.plumber.yaml` if present, then global config `/.plumber.yaml` if present, then default plumber config.
      default: ""

    # Gate configuration
    min_points:
      description: "Minimum Plumber Score points required to pass (0-100). Default: 100 — any finding fails, same as the previous default behavior. Leave empty to keep the default."
      default: ""
    min_score:
      description: "Minimum Plumber Score letter required to pass (A-E), e.g. B fails on C, D, E. When set without min_points, the letter alone gates."
      default: ""
    threshold:
      description: "Deprecated: minimum percentage of passing controls (0-100). Use min_points / min_score to gate on the Plumber Score instead. The default (100) is equivalent to the default score gate and is treated as unset."
      type: number
      default: 100

    # Output configuration
    print_output:
      description: Print text output to stdout
      type: boolean
      default: true
    output_file:
      description: Write JSON results to file (optional, leave empty to skip)
      default: plumber-report.json
    pbom_file:
      description: Write PBOM (Pipeline Bill of Materials) to file (optional, leave empty to skip)
      default: plumber-pbom.json
    pbom_cyclonedx_file:
      description: Write PBOM in CycloneDX SBOM format for security tool integration (optional, leave empty to skip)
      default: plumber-cyclonedx-sbom.json
    glsast_file:
      description: Write a GitLab SAST report (gl-sast-report.json) so findings appear in the Security Dashboard and MR security widget. Auto-uploaded via artifacts:reports:sast. Leave empty to skip.
      default: gl-sast-report.json

    # Job configuration
    stage:
      description: Stage to run the job in
      default: .pre
    image:
      description: "Docker image to use for the job"
      default: "getplumber/plumber@sha256:af863ef89ac10ed478ac255311a601d49e14168ebd74daa602b73b85ee8846e1" #v0.3.101
    allow_failure:
      description: Allow the job to fail without failing the pipeline
      default: false
      type: boolean
    verbose:
      description: Enable verbose/debug output for troubleshooting
      default: false
      type: boolean
    mr_comment:
      description: Post/update a Plumber summary comment on the merge request (requires api scope on the token)
      default: false
      type: boolean
    badge:
      description: Create/update a Plumber letter-score badge on the project (requires api scope; only runs on default branch pipelines)
      default: false
      type: boolean
    score:
      description: "Deprecated no-op: the Plumber score is shown by default now (banner, JSON, PBOM, CycloneDX, a letter-grade badge when badge is enabled, and an MR score line). Kept so pipelines that already set it do not break; it has no effect. Use score_point for the full points breakdown"
      default: false
      type: boolean
    score_point:
      description: "Add the full points breakdown table to stdout and the MR comment (the score banner is shown by default)"
      default: false
      type: boolean
    score_push:
      description: "Publish this repo's Plumber Score to the hosted badge service (score.getplumber.io). Uses CI-native OIDC (no secret needed)."
      default: false
      type: boolean
    score_endpoint:
      description: "Score service base URL. Override only for a self-hosted score service; the OIDC audience follows this value so it always matches the target."
      default: "https://score.getplumber.io"
    controls:
      description: Run only listed controls (comma-separated control names). Cannot be used with skip_controls.
      default: ""
    skip_controls:
      description: Skip listed controls (comma-separated control names). Cannot be used with controls.
      default: ""
    fail_warnings:
      description: Treat configuration warnings (unknown keys) as errors (exit 2)
      default: false
      type: boolean

---

# Plumber Component
# Analyzes GitLab CI/CD pipelines for security issues
#
# Prerequisites:
#   1. Create a GitLab token (PAT or Project/Group Access Token) with:
#      - read_api scope (or api scope if mr_comment is enabled)
#      - read_repository scope
#   2. Add it as GITLAB_TOKEN in Settings > CI/CD > Variables
#      (masked recommended)
#
# Configuration file priority:
#   1. If config_file input is set → uses $CI_PROJECT_DIR/<config_file>
#   2. If .plumber.yaml exists in repo root → uses $CI_PROJECT_DIR/.plumber.yaml
#   3. Otherwise → uses default config embedded in the container
#
# Usage in .gitlab-ci.yml:
#   include:
#     - component: gitlab.com/getplumber/plumber/plumber@~latest
#
# With custom config file:
#   include:
#     - component: gitlab.com/getplumber/plumber/plumber@v0.3.4
#       inputs:
#         config_file: "configs/my-plumber.yaml"  # relative to repo root
#
# With a custom CI configuration file path (or override $CI_CONFIG_PATH in project CI/CD variables):
#   include:
#     - component: gitlab.com/getplumber/plumber/plumber@v0.3.4
#       inputs:
#         ci_config_path: "my-custom-ci.yml"
#
# With other custom inputs:
#   include:
#     - component: gitlab.com/getplumber/plumber/plumber@v0.3.4
#       inputs:
#         min_points: 80
#         output_file: results.json
#         gitlab_token: $MY_CUSTOM_TOKEN_VAR

"plumber":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]  # Override ENTRYPOINT to allow shell script execution
  id_tokens:
    # OIDC id-token for the Plumber Score push. The audience MUST equal the
    # score service URL (the service validates `aud`), so it follows the
    # score_endpoint input. Minted regardless of score_push so enabling the
    # push is a one-line change; the CLI only uses it when push is on.
    PLUMBER_ANALYZE_SCORE_TOKEN:
      aud: $[[ inputs.score_endpoint ]]
  variables:
    # Use intermediate variable to avoid self-reference when default is $GITLAB_TOKEN
    # GITLAB_TOKEN is exported in script (not here) to avoid a circular variable
    # reference: with the default, PLUMBER_TOKEN expands to $GITLAB_TOKEN, so
    # defining GITLAB_TOKEN: $PLUMBER_TOKEN here cycles back on itself.
    PLUMBER_TOKEN: $[[ inputs.gitlab_token ]]
    PLUMBER_ANALYZE_CONFIG: $[[ inputs.config_file ]]
    PLUMBER_ANALYZE_GITLAB_URL: $[[ inputs.server_url ]]
    PLUMBER_ANALYZE_PROJECT: $[[ inputs.project_path ]]
    PLUMBER_ANALYZE_BRANCH: $[[ inputs.branch ]]
    PLUMBER_ANALYZE_MIN_POINTS: $[[ inputs.min_points ]]
    PLUMBER_ANALYZE_MIN_SCORE: $[[ inputs.min_score ]]
    PLUMBER_ANALYZE_THRESHOLD: $[[ inputs.threshold ]]
    PLUMBER_ANALYZE_PRINT: $[[ inputs.print_output ]]
    PLUMBER_ANALYZE_OUTPUT: $[[ inputs.output_file ]]
    PLUMBER_ANALYZE_PBOM: $[[ inputs.pbom_file ]]
    PLUMBER_ANALYZE_PBOM_CYCLONEDX: $[[ inputs.pbom_cyclonedx_file ]]
    PLUMBER_ANALYZE_GLSAST: $[[ inputs.glsast_file ]]
    PLUMBER_ANALYZE_MR_COMMENT: $[[ inputs.mr_comment ]]
    PLUMBER_ANALYZE_BADGE: $[[ inputs.badge ]]
    PLUMBER_ANALYZE_SCORE: $[[ inputs.score ]]
    PLUMBER_ANALYZE_SCORE_POINT: $[[ inputs.score_point ]]
    PLUMBER_ANALYZE_SCORE_PUSH: $[[ inputs.score_push ]]
    PLUMBER_ANALYZE_SCORE_ENDPOINT: $[[ inputs.score_endpoint ]]
    PLUMBER_ANALYZE_CONTROLS: $[[ inputs.controls ]]
    PLUMBER_ANALYZE_SKIP_CONTROLS: $[[ inputs.skip_controls ]]
    PLUMBER_ANALYZE_FAIL_WARNINGS: $[[ inputs.fail_warnings ]]
    PLUMBER_ANALYZE_CI_CONFIG_PATH: $[[ inputs.ci_config_path ]]
    PLUMBER_ANALYZE_VERBOSE: $[[ inputs.verbose ]]
  script:
    # Export GITLAB_TOKEN for the CLI here (runtime), where $PLUMBER_TOKEN is
    # already expanded to the real token value, avoiding the circular reference
    # that occurs if GITLAB_TOKEN is set from $PLUMBER_TOKEN in variables.
    - export GITLAB_TOKEN="$PLUMBER_TOKEN"
    # threshold is deprecated; its typed default (100) is exactly equivalent
    # to the default score gate (min-points 100), so treat it as unset. Only
    # a custom threshold reaches the CLI (and triggers the deprecation
    # warning there).
    - if [ "${PLUMBER_ANALYZE_THRESHOLD:-}" = "100" ]; then unset PLUMBER_ANALYZE_THRESHOLD; fi
    - plumber analyze
  artifacts:
    paths:
      - $[[ inputs.output_file ]]
      - $[[ inputs.pbom_file ]]
      - $[[ inputs.pbom_cyclonedx_file ]]
      - $[[ inputs.glsast_file ]]
    reports:
      cyclonedx:
        - $[[ inputs.pbom_cyclonedx_file ]]
      sast:
        - $[[ inputs.glsast_file ]]
    when: always
    expire_in: 1 week
  allow_failure: $[[ inputs.allow_failure ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
