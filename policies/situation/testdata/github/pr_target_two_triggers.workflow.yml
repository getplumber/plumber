name: ci
on: [pull_request_target, issue_comment]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          path: second
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm test
