# clean: a line carrying both a visible-line fetch and a command-
# substitution fetch must stay suppressed when every one of them is
# allowlisted: the union of the two kinds, not just one of them.
install:
  image: alpine:3.19
  script:
    - bash -c "$(curl -fsSL https://get.docker.com/x.sh)"; curl https://get.docker.com/y.sh | bash
