# Issue #497 guard: a resolvable conditional enable that still caches on
# the publish trigger keeps the High. The expression disables the cache
# on pull_request only, so workflow_dispatch both restores and
# publishes. Expected: 1.
name: plugin
on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: ${{ github.event_name != 'pull_request' && 'maven' || '' }}
      - run: mvn -B package
      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish
