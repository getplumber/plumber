# The key is release-scoped, but restore-keys falls back to an unscoped
# prefix, so a PR-populated `deps-*` cache still wins the lookup. Expected:
# 1 finding on publish. (PR #300 review, FN #8)
name: Release
on: [release]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: release-${{ github.ref_name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-
      - uses: JS-DevTools/npm-publish@v3
