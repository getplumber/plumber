# Issue #497: the workflow runs on the release trigger, but the only
# caching step's if excludes that event, so no cache is restored on the
# release path. Expected: 0.
name: plugin
on:
  release:
    types: [published]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        if: github.event_name != 'release'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-deps
      - run: mvn -B package
