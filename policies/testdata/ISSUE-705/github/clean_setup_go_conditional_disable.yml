# PR #500 review: a default-mode action whose caching is disabled on
# the publish event by a conditional disable expression. On release the
# expression resolves to false, so nothing is restored on the publish
# path, the same safety as the literal cache: false. Expected: 0.
name: release
on:
  release:
    types: [published]
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: ${{ github.event_name != 'release' }}
      - run: make release
