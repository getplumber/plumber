# `npm publish --dry-run` is a verification job, not a real publish. The
# publishScriptPatterns match `npm publish`, but the `--dry-run`
# publishScriptExcludePatterns veto removes it, so the job is not release
# context and the unscoped cache is not flagged. Expected: 0.
# (PR #300 bot review — publishScriptExcludePatterns)
name: Verify
on: [push]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-${{ hashFiles('**/package-lock.json') }}
      - run: npm publish --dry-run
