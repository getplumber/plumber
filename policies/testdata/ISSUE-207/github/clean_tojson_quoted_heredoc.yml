# Safe sink (#229): toJSON escapes quotes/newlines (no heredoc-delimiter
# breakout) AND the quoted heredoc (<<"EOF") disables shell expansion, so
# $()/backticks in the value never execute. This is the PrestaShop
# pattern. Expected: 0 findings.
name: Safe toJSON in quoted heredoc
on: pull_request_target

jobs:
  safe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          description=$(
          cat <<"EOF"
          ${{ toJSON(github.event.pull_request.body) }}
          EOF
          )
          echo "len=${#description}"
