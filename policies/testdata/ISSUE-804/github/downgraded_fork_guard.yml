# pull_request_target + checkout of the PR head, BUT the job carries
# an `if:` guard that restricts execution to same-repository pull
# requests. The guard is read off the condition's text, so it downgrades
# the finding (forkGuard, priced Low) and never drops it. Expected: 1
# finding.
name: PR Preview
on: [pull_request_target]

jobs:
  preview:
    if: >
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm install && npm test
