# workflow_run after "Release", checking out the triggering head. The
# upstream never runs on a pull request, so the head is the repository's
# own commit, not fork code. Expected: no finding.
name: Publish Release
on:
  workflow_run:
    workflows:
      - Release
    types: [completed]
    branches: [main]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: ./publish.sh
