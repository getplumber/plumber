# Same `github.event.inputs.*` expansion, but the only trigger is
# workflow_dispatch: the input value comes from the maintainer who
# pressed "Run", not from a caller or fork. Gated out to avoid noise.
# Expected: 0 findings.
name: Manual release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: ./release.sh ${{ github.event.inputs.version }}
