# Release workflow uses softprops/action-gh-release but no signing
# step. Expected: 1 finding on publish.
name: Release
on: [release]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
