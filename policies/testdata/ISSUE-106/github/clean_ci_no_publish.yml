# Plain CI workflow without any publish action: caching here is
# intended and not release-relevant. Expected: 0 findings.
name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm test
