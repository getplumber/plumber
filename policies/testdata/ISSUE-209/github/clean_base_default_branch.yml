# The BASE repo's default_branch is admin metadata, not attacker-controlled
# (#230). Only the fork's head.repo.default_branch is. Must stay silent.
name: Base default branch
on: [pull_request_target]

jobs:
  safe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "D=${{ github.event.repository.default_branch }}" >> $GITHUB_ENV
