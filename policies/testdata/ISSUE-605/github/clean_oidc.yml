# No password: input — OIDC trusted publishing (permission
# id-token: write declared at job level). Expected: 0 findings.
name: Publish
on: [release]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@v1
