name: clean_secret_outside_substitution
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          deploy-tool --token ${{ secrets.DEPLOY_TOKEN }} --config $(curl -fsS https://config.internal-tool.example/prod.json)
          deploy-tool --token ${{ secrets.DEPLOY_TOKEN }} --config `curl -fsS https://cfg.example/prod.json`
