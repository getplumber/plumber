# Standard pull_request and push triggers run without access to the
# base repo's secrets on forks, so they are not subject to the same
# privilege-escalation risk. Expected: 0 findings.
name: Standard PR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci"
