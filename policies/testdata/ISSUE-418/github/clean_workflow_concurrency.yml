# Workflow-level concurrency: concurrent pushes on the same ref get
# the newer run cancelled/superseded. Expected: 0 findings.
name: Deploy
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
