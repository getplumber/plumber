# Runs Plumber on this repository the same way a user would: it analyzes the
# repo's own workflows, uploads findings to Code Scanning (Security tab), and
# fails the job when the Plumber Score is below the gate. Findings are uploaded even
# when the scan fails, so the Security tab always reflects the latest state.
#
# Plumber is built from source so the gate tracks the code in this repo (the
# released binary may lag behind --sarif and friends). Once a release with the
# action exists, this can switch to `uses: getplumber/plumber@<sha>`.
name: Plumber

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  plumber:
    name: Plumber
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write          # mint the OIDC id-token for the Plumber Score push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'

      - name: Build Plumber from source
        run: |
          cp defaultConfig/.plumber.yaml internal/defaultconfig/default.yaml
          go build -o plumber .

      - name: Run Plumber analyze
        id: analyze
        # Do not abort here on findings: we still want to upload the SARIF
        # below. The dedicated "Enforce" step turns a finding into a job
        # failure after the upload has happened.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --score-push is safe on every trigger: the CLI publishes on every
          # run, and the score service keeps only the default-branch result for
          # the public badge (it reads the verified branch from the OIDC token
          # claim, which the CLI cannot forge).
          # No --config: analyze auto-discovers the repo-root .plumber.yaml,
          # which is Plumber's own self-scan config. That is a separate artifact
          # from the shipped default (defaultConfig/.plumber.yaml, embedded in
          # the binary for zero-config users), so editing our self-scan trust
          # list never changes the shipped default (getplumber/plumber#352).
          ./plumber analyze \
            --sarif plumber.sarif \
            --output plumber-report.json \
            --score-point \
            --score-push \
            --fail-warnings

      - name: Upload SARIF to Code Scanning
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: plumber.sarif

      # Save the raw reports as a downloadable artifact so the JSON / SARIF
      # outputs (including the "could not verify" warnings) can be inspected
      # after the run, not just in the Security tab. always() so they upload
      # even when --fail-warnings fails the job.
      - name: Upload Plumber reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plumber-reports
          path: |
            plumber.sarif
            plumber-report.json
          if-no-files-found: warn

      - name: Enforce score gate
        if: ${{ always() && steps.analyze.outcome == 'failure' }}
        run: |
          echo "::error::Plumber failed: the Plumber Score is below the gate, or a check could not be verified with --fail-warnings (exit 3). See the analyze step log and the Security tab."
          exit 1
