# Runs Plumber on this repository the same way a user would: it analyzes the
# repo's own workflows, uploads findings to Code Scanning (Security tab), and
# fails the job when compliance is below threshold. Findings are uploaded even
# when the scan fails, so the Security tab always reflects the latest state.
#
# Plumber is built from source so the gate tracks the code in this repo (the
# released binary may lag behind --sarif and friends). Once a release with the
# action exists, this can switch to `uses: getplumber/plumber@<sha>`.
name: Plumber compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  plumber:
    name: Plumber analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Build Plumber from source
        run: |
          cp .plumber.yaml internal/defaultconfig/default.yaml
          go build -o plumber .

      - name: Run Plumber analyze
        id: analyze
        # Do not abort here on findings: we still want to upload the SARIF
        # below. The dedicated "Enforce" step turns a finding into a job
        # failure after the upload has happened.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./plumber analyze \
            --sarif plumber.sarif \
            --output plumber-report.json \
            --glsast plumber-gl-sast.json \
            --score-point \
            --threshold 100 \
            --fail-warnings

      - name: Upload SARIF to Code Scanning
        if: ${{ always() && hashFiles('plumber.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        with:
          sarif_file: plumber.sarif

      # Save the raw reports as a downloadable artifact so the JSON / SARIF /
      # GLSAST outputs (including the "could not verify" warnings) can be
      # inspected after the run, not just in the Security tab. always() so
      # they upload even when --fail-warnings fails the job.
      - name: Upload Plumber reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plumber-reports
          path: |
            plumber.sarif
            plumber-report.json
            plumber-gl-sast.json
          if-no-files-found: warn

      - name: Enforce compliance threshold
        if: ${{ always() && steps.analyze.outcome == 'failure' }}
        run: |
          echo "::error::Plumber failed: compliance below threshold, or a check could not be verified with --fail-warnings (exit 3). See the analyze step log and the Security tab."
          exit 1
