name: Release & Publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_notes: ${{ steps.notes.outputs.new_release_notes }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # Run semantic-release directly instead of the third-party
      # cycjimmy/semantic-release-action wrapper. Top-level packages are
      # pinned to exact, immutable npm versions (npm versions are
      # immutable once published and npm verifies each tarball's registry
      # integrity hash on install). A hardcoded checksum is not practical
      # here: semantic-release pulls a large transitive dependency tree
      # and this Go repo carries no package-lock.json to anchor it.
      #
      # Every plugin referenced by .releaserc.json is installed explicitly,
      # including the commit-analyzer / release-notes-generator that ship
      # as semantic-release dependencies — so plugin resolution never
      # depends on transitive hoisting. Versions match semantic-release
      # 23.1.1's declared ranges (commit-analyzer ^12, notes-generator ^13).
      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@23.1.1 \
            @semantic-release/commit-analyzer@12.0.0 \
            @semantic-release/release-notes-generator@13.0.0 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/exec@6.0.3 \
            @semantic-release/git@10.0.1 \
            conventional-changelog-conventionalcommits@7.0.2

      # The release-detection outputs (new_release_published,
      # new_release_version) are written by the @semantic-release/exec
      # successCmd in .releaserc.json — it runs only on a published
      # release — replacing the outputs the wrapper action used to set.
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release

      # Release notes are extracted from the top section of CHANGELOG.md
      # (semantic-release/changelog wrote it during this same job) rather
      # than passed through the exec template, which cannot carry the
      # multi-line, special-char notes safely.
      - name: Expose release notes
        id: notes
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          {
            echo "new_release_notes<<__PLUMBER_NOTES_EOF__"
            awk '/^## \[/{n++} n==1' CHANGELOG.md
            echo "__PLUMBER_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: Build Binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: Prepare embedded config
        run: cp .plumber.yaml internal/defaultconfig/default.yaml

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.release.outputs.new_release_version }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BINARY_NAME="plumber-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags="-s -w -X github.com/getplumber/plumber/cmd.Version=${VERSION} -X github.com/getplumber/plumber/cmd.Commit=${COMMIT} -X github.com/getplumber/plumber/cmd.BuildDate=${BUILD_DATE}" -o "dist/${BINARY_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plumber-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  upload-release:
    name: Create Release & Upload Assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [release, binaries]
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum plumber-* > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/plumber-*

      - name: Copy attestation bundle to dist
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      # Create the GitHub release with the official, pre-installed gh CLI
      # instead of the third-party softprops/action-gh-release. The notes
      # are passed via an env var and a --notes-file (never interpolated
      # into the script body) so arbitrary commit text in the release
      # notes cannot inject shell commands.
      # GH_REPO gives the gh CLI the repository context. This job does not
      # check out the repo (it only consumes downloaded artifacts), so
      # without GH_REPO gh would fail with "not a git repository".
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
          NOTES: ${{ needs.release.outputs.new_release_notes }}
        run: |
          printf '%s' "$NOTES" > release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            dist/plumber-* dist/checksums.txt dist/provenance.intoto.jsonl

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: getplumber/plumber
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Always rebuild the `runtime` stage so `apk upgrade` re-runs and pulls
          # current OS security fixes; the cached `builder` stage keeps Go builds
          # fast. Without this the runtime layer is restored from gha cache release
          # after release and ships stale openssl/curl/git.
          no-cache-filter: runtime

      - name: Attest Docker image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: docker.io/getplumber/plumber
          subject-digest: ${{ steps.push.outputs.digest }}

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [release, upload-release]
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Download checksums
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          curl -sL "https://github.com/getplumber/plumber/releases/download/v${VERSION}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Extract checksums
        id: checksums
        run: |
          echo "darwin_arm64=$(grep 'plumber-darwin-arm64$' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$(grep 'plumber-darwin-amd64$' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(grep 'plumber-linux-arm64$' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(grep 'plumber-linux-amd64$' checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: getplumber/homebrew-plumber
          path: homebrew-tap
          persist-credentials: false

      - name: Update formulas
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
        run: |
          cd homebrew-tap/Formula

          # Update main formula (plumber.rb)
          cat > plumber.rb << 'FORMULA'
          # typed: false
          # frozen_string_literal: true

          class Plumber < Formula
            desc "CI/CD compliance scanner for GitLab pipelines"
            homepage "https://getplumber.io"
            version "VERSION_PLACEHOLDER"
            license "MPL-2.0"

            on_macos do
              on_arm do
                url "https://github.com/getplumber/plumber/releases/download/v#{version}/plumber-darwin-arm64"
                sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

                def install
                  bin.install "plumber-darwin-arm64" => "plumber"
                end
              end

              on_intel do
                url "https://github.com/getplumber/plumber/releases/download/v#{version}/plumber-darwin-amd64"
                sha256 "SHA_DARWIN_AMD64_PLACEHOLDER"

                def install
                  bin.install "plumber-darwin-amd64" => "plumber"
                end
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/getplumber/plumber/releases/download/v#{version}/plumber-linux-arm64"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"

                def install
                  bin.install "plumber-linux-arm64" => "plumber"
                end
              end

              on_intel do
                url "https://github.com/getplumber/plumber/releases/download/v#{version}/plumber-linux-amd64"
                sha256 "SHA_LINUX_AMD64_PLACEHOLDER"

                def install
                  bin.install "plumber-linux-amd64" => "plumber"
                end
              end
            end

            test do
              assert_match "plumber version #{version}", shell_output("#{bin}/plumber --version")
            end
          end
          FORMULA

          # Strip leading spaces (10 spaces from YAML indentation)
          sed -i 's/^          //' plumber.rb

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" plumber.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${SHA_DARWIN_ARM64}/g" plumber.rb
          sed -i "s/SHA_DARWIN_AMD64_PLACEHOLDER/${SHA_DARWIN_AMD64}/g" plumber.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${SHA_LINUX_ARM64}/g" plumber.rb
          sed -i "s/SHA_LINUX_AMD64_PLACEHOLDER/${SHA_LINUX_AMD64}/g" plumber.rb

          # Create versioned formula
          VERSION_UNDERSCORE=$(echo "${VERSION}" | tr -d '.')
          VERSIONED_FILE="plumber@${VERSION}.rb"

          cat > "${VERSIONED_FILE}" << VERSIONED
          # typed: false
          # frozen_string_literal: true

          class PlumberAT${VERSION_UNDERSCORE} < Formula
            desc "CI/CD compliance scanner for GitLab pipelines"
            homepage "https://getplumber.io"
            version "${VERSION}"
            license "MPL-2.0"

            on_macos do
              on_arm do
                url "https://github.com/getplumber/plumber/releases/download/v${VERSION}/plumber-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"

                def install
                  bin.install "plumber-darwin-arm64" => "plumber"
                end
              end

              on_intel do
                url "https://github.com/getplumber/plumber/releases/download/v${VERSION}/plumber-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"

                def install
                  bin.install "plumber-darwin-amd64" => "plumber"
                end
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/getplumber/plumber/releases/download/v${VERSION}/plumber-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"

                def install
                  bin.install "plumber-linux-arm64" => "plumber"
                end
              end

              on_intel do
                url "https://github.com/getplumber/plumber/releases/download/v${VERSION}/plumber-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"

                def install
                  bin.install "plumber-linux-amd64" => "plumber"
                end
              end
            end

            keg_only :versioned_formula

            test do
              assert_match "plumber version ${VERSION}", shell_output("#{bin}/plumber --version")
            end
          end
          VERSIONED

          # Strip leading spaces from versioned formula
          sed -i 's/^          //' "${VERSIONED_FILE}"

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${HOMEBREW_TAP_TOKEN}"; }; f'
          git add Formula/
          git commit -m "Update to v${VERSION}"
          git push

  pin-refs:
    name: Pin release refs (SHA + image digest)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [release, docker]
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The app token is supplied at push time through a credential helper
      # that reads it from the step env (same pattern as the homebrew job):
      # .git/config only ever stores the literal helper script, never the
      # token, so no credential outlives this step.
      - name: Pin README SHA and template image digest
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          RELEASE_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The release tag points at the chore(release) commit; pin to it so
          # uses:@<sha> matches uses:@v${VERSION}.
          SHA="$(git rev-parse "v${VERSION}^{commit}")"
          bash scripts/release-pin-refs.sh "$VERSION" "$SHA" "$DIGEST"
          if git diff --quiet; then
            echo "No ref changes to commit."
            exit 0
          fi
          git config user.name "plumber-release-bot[bot]"
          git config user.email "plumber-release-bot[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${RELEASE_APP_TOKEN}"; }; f'
          git add README.md templates/plumber.yml
          git commit -m "ci(release): pin v${VERSION} refs [skip ci]"
          git push origin HEAD:main
