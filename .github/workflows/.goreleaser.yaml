version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - s -w -X github.com/getplumber/plumber/cmd.Version={{.Version}} -X github.com/getplumber/plumber/cmd.Commit={{.Commit}} -X github.com/getplumber/plumber/cmd.BuildDate={{.Date}}

archives:
  - formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: getplumber
    name: plumber
  draft: false
  prerelease: auto
  make_latest: true
  replace_existing_draft: true
  name_template: '{{ .Tag }}'
  header: |

  footer: |
    ## Enjoy 👨🏻‍🔧
    📆 {{ .Now.Format "2006-01-02" }} - Copyright @getplumber

homebrew_casks:
  - name: plumber
    homepage: https://getplumber.io/
    commit_author:
      name: getplumber
      email: noreply@getplumber.io
    license: Apache-2.0
    url:
      template: "https://github.com/yodamad/migraptor/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: getplumber
      name: homebrew-plumber
      branch: main
