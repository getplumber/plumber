name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Exact patch versions: floating specs (stable/oldstable) resolve
        # to a different toolchain over time without any workflow change.
        # Floor is 1.26.0, the module's minimum (go.mod `go` directive, raised
        # to 1.26 by golang.org/x/crypto v0.56.0 which clears the x/crypto/ssh
        # advisories); 1.26.11 matches the pinned toolchain.
        go-version: ['1.26.11', '1.26.0']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

  clean-tree-build:
    name: Build from committed tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'

      # Build from what git actually tracks. Every other job builds the
      # working tree, which can contain generated or git-ignored files that
      # never reach the published module zip, so they all stayed green while
      # `go install` was broken for months (getplumber/plumber#405). This job
      # is the only one that sees what a consumer sees.
      - name: Build from committed tree only
        run: |
          set -eo pipefail
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          go build ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'

      # TestCorpus is left out here and run by the Corpus job below, in
      # parallel with this one. The corpus replays 210 captured repositories
      # through the policy engine: 90 of the 91 seconds of test time in the
      # control package, and the race detector multiplies OPA evaluation by
      # about six, so it alone made this job the longest of the workflow
      # (4.5 min of a 5 min PR). Both jobs keep -race: TestCorpus is the only
      # test of the package that evaluates policies concurrently (t.Parallel),
      # so it is what race-checks the engine's shared caches. The pattern is
      # anchored: -skip and -run are regular expressions, and the five
      # TestCorpus* siblings (the corpus's own checks) stay in this run.
      - name: Run tests
        run: go test ./... -race -skip '^TestCorpus$' -timeout 30m -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  corpus:
    name: Corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'

      # The precision gate of the control package (see corpus_test.go):
      # every known path of an incident found at its tier, no clean case
      # above its bound. Under -race, see the Test job for why. Only
      # TestCorpus itself: its TestCorpus* siblings run in the Test job.
      - name: Run the corpus
        run: go test ./control -race -run '^TestCorpus$' -count=1 -timeout 15m

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'

      # golangci-lint-action downloads the pinned release binary, verifies
      # its checksum, and caches the linter's analysis results between runs
      # so only the packages whose inputs changed are re-analyzed. The
      # action itself is pinned to a commit in actions.lock.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.10.1

      # Whole-program dead code check. The `unused` linter can't flag
      # unreachable exported functions or code kept alive only by its own
      # tests; deadcode does reachability analysis from main. The tool
      # always exits 0, so fail on any output. Built from an immutable
      # commit pin; sum.golang.org verifies the download cryptographically.
      #
      # finding/identity is exempt: it publishes the finding-identity recipe
      # for consumers outside this module (#403), so reachability from our own
      # main says nothing about whether its API is used. Its surface is pinned
      # by finding/identity/identity_test.go instead.
      #
      # ControlsCatalog and ConfigSchemas are exempt for the same reason: they
      # are catalog exports consumed by the platform (#440, #458), not by this
      # module's main.
      #
      # internal/testsupport is exempt because only tests import it: the
      # shared YAML-to-IR readers of the rule, situation and corpus tests.
      # deadcode does not load test files, so from main all of it is
      # unreachable by construction; the tests that call it are its check.
      #
      # The analyzer runs on its own line, and only its output is filtered.
      # Piping it straight into `grep -v ... || true` would make a broken run
      # (module download failure, toolchain mismatch, a package that does not
      # compile) indistinguishable from a clean one: the `|| true` needed for
      # the healthy path, where grep suppresses every line, would swallow the
      # tool's own failure and pass the step with the safety net switched off.
      - name: deadcode
        run: |
          raw=$(go run golang.org/x/tools/cmd/deadcode@09747cdf594a7924dcecb506312be3bd6e437962 ./...) # v0.30.0
          out=$(printf '%s\n' "$raw" | grep -v '^finding/identity/' | grep -v '^internal/testsupport/' | grep -v 'unreachable func: ControlsCatalog' | grep -v 'unreachable func: ConfigSchemas' || true)
          if [ -n "$out" ]; then echo "$out"; echo "dead code detected"; exit 1; fi

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'

      - name: Install and run govulncheck
        # setup-go pins GOTOOLCHAIN=local, which makes `go` ignore the
        # `toolchain` directive in go.mod. Override to auto so the pinned
        # patched toolchain (go.mod) is downloaded/used and stdlib advisories
        # fixed in that release are picked up.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  grype:
    name: Container Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The image is the Dockerfile, its build context (.dockerignore) and
      # the Go module graph. On a pull request the build and the scan run
      # only when one of those changed against the base branch; every push
      # to main scans. If the base commit cannot be fetched, scan anyway.
      # Plain git, no changed-files action.
      - name: Decide whether the image can have changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push: scanning"
            exit 0
          fi
          if ! git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base $BASE_SHA could not be fetched: scanning"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- Dockerfile .dockerignore go.mod go.sum .github/workflows/ci.yml)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "image inputs changed:"; echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no change to Dockerfile, .dockerignore, go.mod, go.sum or this workflow: image scan skipped"
          fi

      - name: Build Docker image
        if: steps.changes.outputs.run == 'true'
        run: docker build -t plumber:ci .

      # Grype is installed directly from a pinned release and verified
      # against a checksum committed to this repo, NOT via
      # anchore/scan-action. The action, though pinnable by SHA, fetches
      # and executes install.sh from anchore/grype@main at runtime — a
      # moving ref that voids the immutability the SHA pin implies. The
      # hash below is the only trust anchor; bump both together.
      - name: Install grype (pinned + checksum-verified)
        if: steps.changes.outputs.run == 'true'
        env:
          GRYPE_VERSION: "0.116.0"
          GRYPE_SHA256: "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/grype.tar.gz" -C "$tmp" grype
          sudo install "$tmp/grype" /usr/local/bin/grype
          grype version

      - name: Grype image scan
        if: steps.changes.outputs.run == 'true'
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: grype "plumber:ci" --fail-on high --only-fixed

