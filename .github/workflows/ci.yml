name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ['stable', 'oldstable']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Prepare embedded config
        run: cp .plumber.yaml internal/defaultconfig/default.yaml

      - name: Build
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Prepare embedded config
        run: cp .plumber.yaml internal/defaultconfig/default.yaml

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Prepare embedded config
        run: cp .plumber.yaml internal/defaultconfig/default.yaml

      # Run golangci-lint via `go install` instead of the third-party
      # golangci-lint-action wrapper — no external action is trusted, and
      # the linter is built from an immutable commit pin (v2.10.1). Go's
      # module checksum database (sum.golang.org) verifies the download
      # cryptographically, so no separate checksum step is needed.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@5d1e709b7be35cb2025444e19de266b056b7b7ee # v2.10.1
          golangci-lint run

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Prepare embedded config
        run: cp .plumber.yaml internal/defaultconfig/default.yaml

      - name: Install and run govulncheck
        # setup-go pins GOTOOLCHAIN=local, which makes `go` ignore the
        # `toolchain` directive in go.mod. Override to auto so the pinned
        # patched toolchain (go.mod) is downloaded/used and stdlib advisories
        # fixed in that release are picked up.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  grype:
    name: Container Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t plumber:ci .

      - name: Grype image scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: plumber:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

  # trivy:
  #   name: Container Scan (Trivy)
