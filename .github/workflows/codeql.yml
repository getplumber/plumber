name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: go
          # Without this, the CodeQL bundle version is resolved from
          # GitHub's live feature flags at run time, so the action SHA
          # alone does not pin the toolchain. "linked" forces the
          # bundle version shipped with the pinned action release.
          tools: linked

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.0
