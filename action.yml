name: "Plumber Compliance Scanner"
description: "CI/CD compliance scanner for GitHub Actions workflows and repository settings. Uploads SARIF to Code Scanning."
author: "Plumber (getplumber.io)"

branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "Plumber release tag to install (e.g. v0.3.35). Downloaded from GitHub Releases and verified against checksums.txt and SLSA attestation"
    default: "v0.3.35"
  verify-attestation:
    description: "Verify the downloaded binary's build-provenance attestation (sigstore/SLSA) against the getplumber/plumber release workflow, using the gh CLI. This anchors the binary to a trusted build regardless of the mutable release tag. Disable for air-gapped or GHES setups without attestation access."
    default: "true"
  github-token:
    description: "Token for the GitHub API (branch protection, advisory DB) and SARIF upload. Needs Administration:read for full branchMustBeProtected, and the job needs security-events:write to upload SARIF."
    default: ${{ github.token }}
  project:
    description: "owner/repo to scan remotely (upstream-fetch, no checkout needed). Default: scan the checked-out repository."
    default: ""
  github-url:
    description: "GitHub Enterprise Server host, e.g. ghes.example.com. Default: github.com."
    default: ""
  threshold:
    description: "Minimum compliance percentage to pass (0-100)."
    default: "100"
  config-file:
    description: "Path to a .plumber.yaml config. Default: the repo's .plumber.yaml (required — the run fails if absent; generate one with 'plumber config generate')."
    default: ""
  controls:
    description: "Run only these controls (comma-separated). Mutually exclusive with skip-controls."
    default: ""
  skip-controls:
    description: "Skip these controls (comma-separated). Mutually exclusive with controls."
    default: ""
  score:
    description: "Show the Plumber letter score, points and breakdown."
    default: "true"
  fail-warnings:
    description: "Treat configuration warnings (unknown keys) as errors."
    default: "false"
  soft-fail:
    description: "Do not fail the job when compliance is below the threshold. Findings are still produced and uploaded. Runtime errors still fail."
    default: "false"
  upload-sarif:
    description: "Upload the SARIF report to GitHub Code Scanning (the job needs security-events: write)."
    default: "true"
  upload-artifacts:
    description: "Upload the JSON report, PBOM and CycloneDX SBOM as a workflow artifact."
    default: "true"
  artifact-name:
    description: "Name of the uploaded artifact bundle."
    default: "plumber-compliance"
  output:
    description: "JSON report output path. Empty to skip."
    default: "plumber-report.json"
  pbom:
    description: "PBOM (Pipeline Bill of Materials) output path. Empty to skip."
    default: "plumber-pbom.json"
  pbom-cyclonedx:
    description: "CycloneDX SBOM output path. Empty to skip."
    default: "plumber-cyclonedx-sbom.json"
  sarif:
    description: "SARIF 2.1.0 output path. Empty to skip."
    default: "plumber.sarif"

outputs:
  compliance:
    description: "Overall compliance percentage from the run."
    value: ${{ steps.run.outputs.compliance }}
  passed:
    description: "'true' when compliance is at or above the threshold."
    value: ${{ steps.run.outputs.passed }}
  report:
    description: "Path to the JSON report."
    value: ${{ inputs.output }}
  sarif:
    description: "Path to the SARIF report."
    value: ${{ inputs.sarif }}

runs:
  using: "composite"
  steps:
    - name: Install Plumber
      shell: bash
      env:
        PLUMBER_VERSION: ${{ inputs.version }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        ext=""; [ "$os" = "windows" ] && ext=".exe"
        asset="plumber-${os}-${arch}${ext}"

        if [ "$PLUMBER_VERSION" = "latest" ]; then
          base="https://github.com/getplumber/plumber/releases/latest/download"
        else
          base="https://github.com/getplumber/plumber/releases/download/${PLUMBER_VERSION}"
        fi

        tmp="$(mktemp -d)"
        echo "Downloading ${asset} from ${base}"
        curl -fsSL -o "${tmp}/${asset}" "${base}/${asset}"
        curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"

        # Verify the downloaded binary against the published checksums.
        line="$(grep "  ${asset}\$" "${tmp}/checksums.txt" || true)"
        if [ -z "$line" ]; then
          echo "::error::No checksum entry for ${asset} in checksums.txt"; exit 1
        fi
        ( cd "$tmp" && { command -v sha256sum >/dev/null 2>&1 \
            && printf '%s\n' "$line" | sha256sum -c - \
            || printf '%s\n' "$line" | shasum -a 256 -c -; } )

        # Verify build provenance. The checksum above only proves the download
        # matches checksums.txt from the SAME (mutable) release, so it guards
        # transit integrity, not a compromised or re-pointed release. The
        # attestation ties the binary's digest back to the getplumber/plumber
        # release workflow via sigstore/SLSA, which a moved tag cannot forge.
        if [ "$VERIFY_ATTESTATION" = "true" ]; then
          if command -v gh >/dev/null 2>&1; then
            echo "Verifying build provenance attestation for ${asset}"
            gh attestation verify "${tmp}/${asset}" --repo getplumber/plumber
          else
            echo "::error::verify-attestation is true but the gh CLI is not available on this runner. Install gh or set verify-attestation: false."
            exit 1
          fi
        fi

        bindir="${tmp}/bin"; mkdir -p "$bindir"
        mv "${tmp}/${asset}" "${bindir}/plumber${ext}"
        chmod +x "${bindir}/plumber${ext}"
        echo "$bindir" >> "$GITHUB_PATH"

    - name: Run Plumber analyze
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IN_PROJECT: ${{ inputs.project }}
        IN_GITHUB_URL: ${{ inputs.github-url }}
        IN_THRESHOLD: ${{ inputs.threshold }}
        IN_CONFIG: ${{ inputs.config-file }}
        IN_CONTROLS: ${{ inputs.controls }}
        IN_SKIP_CONTROLS: ${{ inputs.skip-controls }}
        IN_SCORE: ${{ inputs.score }}
        IN_FAIL_WARNINGS: ${{ inputs.fail-warnings }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_PBOM: ${{ inputs.pbom }}
        IN_PBOM_CDX: ${{ inputs.pbom-cyclonedx }}
        IN_SARIF: ${{ inputs.sarif }}
      run: |
        set -uo pipefail
        args=(analyze --threshold "$IN_THRESHOLD")
        if [ -n "$IN_PROJECT" ]; then
          # Remote-fetch: scan an upstream repo via the API (no checkout).
          gh_url="${IN_GITHUB_URL:-github.com}"
          args+=(--github-url "$gh_url" --project "$IN_PROJECT")
        elif [ -n "$IN_GITHUB_URL" ]; then
          # Local-clone scan against a GitHub Enterprise Server host: forward
          # --github-url so the run targets the GHES API (and is classified as
          # GitHub even when the host is otherwise indistinguishable).
          args+=(--github-url "$IN_GITHUB_URL")
        fi
        [ -n "$IN_CONFIG" ]         && args+=(--config "$IN_CONFIG")
        [ -n "$IN_CONTROLS" ]       && args+=(--controls "$IN_CONTROLS")
        [ -n "$IN_SKIP_CONTROLS" ]  && args+=(--skip-controls "$IN_SKIP_CONTROLS")
        [ "$IN_SCORE" = "true" ]    && args+=(--score-point)
        [ "$IN_FAIL_WARNINGS" = "true" ] && args+=(--fail-warnings)
        [ -n "$IN_OUTPUT" ]         && args+=(--output "$IN_OUTPUT")
        [ -n "$IN_PBOM" ]           && args+=(--pbom "$IN_PBOM")
        [ -n "$IN_PBOM_CDX" ]       && args+=(--pbom-cyclonedx "$IN_PBOM_CDX")
        [ -n "$IN_SARIF" ]          && args+=(--sarif "$IN_SARIF")

        plumber "${args[@]}"
        code=$?
        echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

        # Surface compliance / passed as step outputs from the JSON report.
        if [ -n "$IN_OUTPUT" ] && [ -f "$IN_OUTPUT" ]; then
          comp="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('compliance',''))" "$IN_OUTPUT" 2>/dev/null || true)"
          passed="$(python3 -c "import json,sys;print(str(json.load(open(sys.argv[1])).get('passed','')).lower())" "$IN_OUTPUT" 2>/dev/null || true)"
          echo "compliance=${comp}" >> "$GITHUB_OUTPUT"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Job summary
      if: ${{ always() }}
      shell: bash
      env:
        IN_OUTPUT: ${{ inputs.output }}
        IN_THRESHOLD: ${{ inputs.threshold }}
        COMPLIANCE: ${{ steps.run.outputs.compliance }}
        PASSED: ${{ steps.run.outputs.passed }}
      run: |
        set -uo pipefail
        {
          echo "## Plumber compliance"
          echo ""
          if [ -n "${COMPLIANCE:-}" ]; then
            status="❌ failed"; [ "${PASSED:-}" = "true" ] && status="✅ passed"
            echo "**Compliance:** ${COMPLIANCE}% (threshold ${IN_THRESHOLD}%): ${status}"
          else
            echo "_Plumber ran; see the job log for the full report._"
          fi
          echo ""
          if [ -f "$IN_OUTPUT" ] && command -v python3 >/dev/null 2>&1; then
            python3 - "$IN_OUTPUT" <<'PY' || true
        import json,sys
        d=json.load(open(sys.argv[1]))
        s=d.get("plumberScore") or {}
        if s:
            print(f"**Plumber Score:** {s.get('score','?')} ({s.get('finalPoints','?')}/100)")
            c=s.get('counts',{})
            print("")
            print(f"Critical {c.get('critical',0)} · High {c.get('high',0)} · Medium {c.get('medium',0)} · Low {c.get('low',0)}")
        PY
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.sarif != '' && hashFiles(inputs.sarif) != '' }}
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      with:
        sarif_file: ${{ inputs.sarif }}

    - name: Upload report artifacts
      if: ${{ always() && inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}
          ${{ inputs.pbom }}
          ${{ inputs.pbom-cyclonedx }}
          ${{ inputs.sarif }}
        if-no-files-found: ignore
        retention-days: 30

    - name: Enforce threshold
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        SOFT_FAIL: ${{ inputs.soft-fail }}
      run: |
        set -uo pipefail
        code="${EXIT_CODE:-2}"
        if [ "$code" = "0" ]; then
          exit 0
        fi
        if [ "$code" = "2" ]; then
          echo "::error::Plumber failed to run (exit 2). See the analyze step log."
          exit 1
        fi
        # exit 1 == compliance below threshold
        if [ "$SOFT_FAIL" = "true" ]; then
          echo "::warning::Compliance is below the threshold, but soft-fail is enabled."
          exit 0
        fi
        echo "::error::Compliance is below the configured threshold."
        exit 1
