# Case reusable-local: a workflow that calls a reusable workflow of the same
# repository. The findings sit in the called workflow, so Plumber must expand it.
name: Caller

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable.yml
